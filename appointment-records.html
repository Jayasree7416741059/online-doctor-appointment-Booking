<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Records | Medicare Hospital</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
.records{
width:90%;
margin:40px auto;
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

table th{
background:#0077ff;
color:white;
padding:15px;
}

table td{
padding:12px;
text-align:center;
border:1px solid #ddd;
}

table tr:nth-child(even){
background:#f5f5f5;
}

.deleteBtn{
background:red;
color:white;
border:none;
padding:8px 12px;
border-radius:5px;
cursor:pointer;
}

.clearBtn{
background:#0077ff;
color:white;
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:20px;
}

.clearBtn:hover{
background:#005fd1;
}
</style>

</head>

<body>

<header>

<div class="logo">
<i class="fa-solid fa-hospital"></i>
<h2>Medicare Hospital</h2>
</div>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>
<a href="doctors.html">Doctors</a>
<a href="appointments.html">Appointment</a>
<a href="appointment-records.html">Records</a>
<a href="contact.html">Contact</a>
<a href="dashboard.html">Dashboard</a>
</nav>

</header>

<section class="hero">

<div class="hero-text">

<h1>Appointment Records</h1>

<p>All booked appointments are displayed here.</p>

</div>

<div class="hero-image">

<img src="images/appointment-records.png" alt="Records">

</div>

</section>

<div class="records">

<button class="clearBtn" onclick="clearAppointments()">
Clear All Records
</button>

<table>

<thead>

<tr>

<th>ID</th>
<th>Patient</th>
<th>Email</th>
<th>Phone</th>
<th>Doctor</th>
<th>Department</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="recordsTable">

</tbody>

</table>

</div>

<footer>

<h3>Medicare Hospital</h3>

<p>Providing Quality Healthcare Since 2000</p>

</footer>

<script>

let appointments =
JSON.parse(localStorage.getItem("appointments")) || [];

let table =
document.getElementById("recordsTable");

function loadAppointments(){

table.innerHTML="";

appointments.forEach((a,index)=>{

table.innerHTML +=`

<tr>

<td>A00${index+1}</td>

<td>${a.name}</td>

<td>${a.email}</td>

<td>${a.phone}</td>

<td>${a.doctor}</td>

<td>${a.department}</td>

<td>${a.date}</td>

<td>${a.status}</td>

<td>

<button class="deleteBtn"
onclick="deleteAppointment(${index})">

Delete

</button>

</td>

</tr>

`;

});

}

function deleteAppointment(index){

appointments.splice(index,1);

localStorage.setItem(
"appointments",
JSON.stringify(appointments)
);

loadAppointments();

}

function clearAppointments(){

if(confirm("Delete all appointment records?")){

localStorage.removeItem("appointments");

appointments=[];

loadAppointments();

}

}

loadAppointments();

</script>

</body>
</html>
