<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment | Medicare Hospital</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
.form-container{
max-width:700px;
margin:40px auto;
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.form-container input,
.form-container select,
.form-container textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

.form-container button{
width:100%;
padding:14px;
background:#0077ff;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.form-container button:hover{
background:#005fd1;
}
</style>

</head>

<body>

<header>
<div class="logo">
<i class="fa-solid fa-hospital"></i>
<h2>Medicare Hospital</h2>
</div>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>
<a href="doctors.html">Doctors</a>
<a href="appointments.html">Appointment</a>
<a href="appointment-records.html">Records</a>
<a href="contact.html">Contact</a>
<a href="dashboard.html">Dashboard</a>
</nav>

</header>

<section class="hero">

<div class="hero-text">
<h1>Book Your Appointment</h1>
<p>Fill the form below to schedule an appointment with our specialist doctors.</p>
</div>

<div class="hero-image">
<img src="images/appointment.png" alt="Appointment">
</div>

</section>

<div class="form-container">

<form id="appointmentForm">

<input type="text" id="name" placeholder="Patient Name" required>

<input type="email" id="email" placeholder="Email Address" required>

<input type="tel" id="phone" placeholder="Phone Number" required>

<input type="date" id="date" required>

<select id="department" required>
<option value="">Select Department</option>
<option>Cardiology</option>
<option>Neurology</option>
<option>Orthopedics</option>
<option>Pediatrics</option>
<option>Dermatology</option>
<option>Gynecology</option>
<option>ENT</option>
<option>General Medicine</option>
</select>

<select id="doctor" required>
<option value="">Select Doctor</option>
<option>Dr. James Wilson</option>
<option>Dr. Sophia Brown</option>
<option>Dr. Emma Johnson</option>
<option>Dr. David Miller</option>
<option>Dr. Grace Taylor</option>
<option>Dr. Olivia Thomas</option>
</select>

<textarea id="problem" rows="5" placeholder="Describe your problem"></textarea>

<button type="submit">
Book Appointment
</button>

</form>

</div>

<footer>

<h3>Medicare Hospital</h3>

<p>Providing Quality Healthcare Since 2000</p>

</footer>

<script>

document.getElementById("appointmentForm").addEventListener("submit",function(e){

e.preventDefault();

let appointment={

name:document.getElementById("name").value,

email:document.getElementById("email").value,

phone:document.getElementById("phone").value,

date:document.getElementById("date").value,

department:document.getElementById("department").value,

doctor:document.getElementById("doctor").value,

problem:document.getElementById("problem").value,

status:"Confirmed"

};

let appointments=JSON.parse(localStorage.getItem("appointments"))||[];

appointments.push(appointment);

localStorage.setItem("appointments",JSON.stringify(appointments));

alert("Appointment Booked Successfully!");

document.getElementById("appointmentForm").reset();

});

</script>

</body>
</html>
