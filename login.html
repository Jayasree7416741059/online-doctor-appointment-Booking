<header>

<!-- Login Section -->
<section class="services">

<h2 class="title">Hospital Login</h2>

<div class="card" style="max-width:450px; margin:40px auto;">

<i class="fa-solid fa-user-doctor"
style="font-size:70px; color:#0077ff; margin-bottom:20px;"></i>

<form id="loginForm">

<input type="email"
placeholder="Enter Email"
required><br><br>

<input type="password"
placeholder="Enter Password"
required><br><br>

<button class="hero-btn" type="submit">
Login
</button>

<br><br>

<p style="text-align:center;">
Don't have an account?
<a href="#">Register</a>
</p>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    alert("✅ Login Successful!");

    window.location.href = "dashboard.html";
});
</script>
